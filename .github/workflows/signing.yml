name: Release Sliccy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ai-ecoverse/sliccy-app'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install locked release tools
        run: npm ci --ignore-scripts
      - name: Test release tooling
        run: npm test
      - name: Analyze commits, build, sign, notarize and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: npm run release
      - name: Retain release assets and generated metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Sliccy-release-${{ github.sha }}
          path: |
            artifacts/signed/Sliccy-*.zip
            !artifacts/signed/Sliccy-notarize.zip
            artifacts/signed/Sliccy-*.dmg
            artifacts/signed/SHA256SUMS
            artifacts/signed/appcast.xml
            artifacts/signed/signing.txt
            release/version.json
            release/notes.md
          if-no-files-found: error
          retention-days: 30
