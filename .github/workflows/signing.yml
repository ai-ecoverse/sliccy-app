name: Signed app

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signed-app-main
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'ai-ecoverse/sliccy-app' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test
        run: |
          /usr/bin/xcrun swift test
          ./script/test_screen_socket.sh
      - name: Build app with pinned CLI
        run: |
          ./script/fetch_cli.sh
          ./script/build_and_run.sh --build
      - name: Sign and notarize
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: ./script/ci_sign.sh dist/Sliccy.app artifacts/signed
      - name: Upload verified app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sliccy-0.1.0-arm64-${{ github.sha }}
          path: |
            artifacts/signed/Sliccy-0.1.0.zip
            artifacts/signed/SHA256SUMS
            artifacts/signed/signing.txt
          if-no-files-found: error
          retention-days: 14
