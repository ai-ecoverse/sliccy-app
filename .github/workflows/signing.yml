name: Signed app

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signed-app-main
  cancel-in-progress: false

jobs:
  sign:
    strategy:
      fail-fast: false
      matrix:
        variant: [app, ipc-proof, universal-proof, snapshot-proof]
    if: github.repository == 'ai-ecoverse/sliccy-app' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test
        run: |
          /usr/bin/xcrun swift test
          /usr/bin/xcrun swift test --scratch-path .build/proof-tests -Xswiftc -DSLICCY_NATIVE_SCREEN_PROOF --filter 'Screen'
          ./script/test_screen_socket.sh
          python3 -m unittest discover -s Tests/UniversalManifest -p 'test_*.py'
          if [[ '${{ matrix.variant }}' == snapshot-proof ]]; then
            /usr/bin/xcrun swift test --scratch-path .build/snapshot-tests -Xswiftc -DSLICCY_NATIVE_SCREEN_PROOF -Xswiftc -DSLICCY_SNAPSHOT_PROOF --filter 'Screen'
          fi
      - name: Build app with pinned CLI
        env:
          SLICCY_NATIVE_SCREEN_PROOF: ${{ matrix.variant == 'ipc-proof' && '1' || '0' }}
          SLICCY_UNIVERSAL_SLICE_PROOF: ${{ matrix.variant == 'universal-proof' && '1' || '0' }}
          SLICCY_SNAPSHOT_PROOF: ${{ matrix.variant == 'snapshot-proof' && '1' || '0' }}
        run: |
          ./script/fetch_cli.sh
          if [[ '${{ matrix.variant }}' == snapshot-proof ]]; then ./script/fetch_snapshot_cli.sh; fi
          ./script/build_and_run.sh --build
      - name: Sign and notarize
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [[ '${{ matrix.variant }}' == ipc-proof ]]; then
            ./script/ci_sign.sh dist-proof/Sliccy.app artifacts/signed
          elif [[ '${{ matrix.variant }}' == universal-proof ]]; then
            ./script/ci_sign.sh dist-universal-proof/Sliccy.app artifacts/signed
          elif [[ '${{ matrix.variant }}' == snapshot-proof ]]; then
            ./script/ci_sign.sh dist-snapshot-proof/Sliccy.app artifacts/signed
          else
            ./script/ci_sign.sh dist/Sliccy.app artifacts/signed
          fi
      - name: Upload verified app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.variant == 'snapshot-proof' && 'Sliccy-Snapshot-Proof-0.1.0-arm64' || matrix.variant == 'universal-proof' && 'Sliccy-Universal-Proof-0.1.0-universal' || matrix.variant == 'ipc-proof' && 'Sliccy-IPC-Proof-0.1.0-arm64' || 'Sliccy-0.1.0-arm64' }}-${{ github.sha }}
          path: |
            artifacts/signed/Sliccy-0.1.0.zip
            artifacts/signed/SHA256SUMS
            artifacts/signed/signing.txt
            artifacts/signed/universal-manifest.json
            artifacts/signed/snapshot-manifest.json
          if-no-files-found: error
          retention-days: 14
