name: Release Sliccy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ai-ecoverse/sliccy-app'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 script/release_metadata.py --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/sliccy-releases.json"
          python3 script/check_release_version.py "$RUNNER_TEMP/sliccy-releases.json" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          /usr/bin/xcrun swift test
          python3 -m unittest discover -s Tests/Release -p 'test_*.py'
      - name: Build production app
        if: steps.version.outputs.publish == 'true'
        env:
          SLICCY_RELEASE: '1'
        run: |
          ./script/fetch_cli.sh
          ./script/build_and_run.sh --build
      - name: Sign and notarize
        if: steps.version.outputs.publish == 'true'
        env:
          SLICCY_RELEASE: '1'
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: ./script/ci_sign.sh dist/Sliccy.app artifacts/signed
      - name: Sign update archive and verify release metadata
        if: steps.version.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 script/prepare_release.py artifacts/signed
      - name: Retain verified release assets
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sliccy-${{ steps.version.outputs.version }}-arm64-${{ github.sha }}
          path: |
            artifacts/signed/Sliccy-*.zip
            !artifacts/signed/Sliccy-notarize.zip
            artifacts/signed/SHA256SUMS
            artifacts/signed/appcast.xml
            artifacts/signed/signing.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --title "Sliccy $VERSION" --notes-file release/notes.md \
            "artifacts/signed/Sliccy-$VERSION.zip" artifacts/signed/SHA256SUMS artifacts/signed/appcast.xml
          gh release edit "v$VERSION" --draft=false --latest
