name: Helper12 isolated signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper12-signing
  cancel-in-progress: false

jobs:
  sign-helper12:
    if: github.repository == 'ai-ecoverse/sliccy-app' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build fixed helper12 source and synthetic presence tests
        run: ./script/build_helper12.sh
      - name: Sign and notarize helper12 only
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: ./script/ci_sign_helper12.sh
      - name: Upload verified helper12 only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sliccy-Proof-Helper12-0.1.0-arm64-${{ github.sha }}
          path: |
            artifacts/helper12/ScreenProofSurface-0.1.0.zip
            artifacts/helper12/SHA256SUMS
            artifacts/helper12/signing.txt
            artifacts/helper12/entitlements.plist
            artifacts/helper12/notarization.json
            artifacts/helper12/helper-manifest.json
          if-no-files-found: error
          retention-days: 14
