name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: /usr/bin/xcrun swift test
      - run: ./script/test_screen_socket.sh
