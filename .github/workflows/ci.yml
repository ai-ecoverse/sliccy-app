name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: /usr/bin/xcrun swift test
      - run: ./script/test_screen_socket.sh
