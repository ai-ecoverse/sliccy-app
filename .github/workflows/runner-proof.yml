name: Isolated screen diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: isolated-screen-diagnostic
  cancel-in-progress: false

jobs:
  prerequisite:
    if: github.repository == 'ai-ecoverse/sliccy-app' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/proof/runner-capture-v1'
    runs-on: xcode-27
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Staging prerequisite probe
        id: prerequisite
        shell: bash
        env:
          SLICCY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          umask 077
          if python3 -B script/runner-proof/sealed_prerequisite.py > "$RUNNER_TEMP/sliccy-prerequisite-bootstrap.log" 2>&1; then
            echo 'Prerequisite probe finished; inspect sealed evidence.'
          else
            echo 'Prerequisite probe incomplete; inspect sealed evidence if available.'
            exit 1
          fi
      - name: Retain sealed prerequisite evidence
        if: always() && steps.prerequisite.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prerequisite-diagnostic-sealed
          path: ${{ runner.temp }}/sliccy-prerequisite-evidence.age
          if-no-files-found: error
          retention-days: 3

  owner-identity:
    if: false
    runs-on: xcode-27
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only owner identity probe
        id: identity
        shell: bash
        env:
          SLICCY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          umask 077
          if python3 -B script/runner-proof/sealed_owner_identity.py > "$RUNNER_TEMP/sliccy-owner-identity-bootstrap.log" 2>&1; then
            echo 'Owner identity probe finished; inspect sealed evidence.'
          else
            echo 'Owner identity probe incomplete; inspect sealed evidence if available.'
            exit 1
          fi
      - name: Retain sealed owner identity evidence
        if: always() && steps.identity.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-identity-diagnostic-sealed
          path: ${{ runner.temp }}/sliccy-owner-identity-evidence.age
          if-no-files-found: error
          retention-days: 3

  setup-read-only:
    if: false
    runs-on: xcode-27
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only setup diagnostic
        id: setup
        shell: bash
        env:
          SLICCY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          umask 077
          if python3 -B script/runner-proof/sealed_tcc_dry_run.py > "$RUNNER_TEMP/sliccy-tcc-setup-bootstrap.log" 2>&1; then
            echo 'Setup diagnostic finished; inspect sealed evidence.'
          else
            echo 'Setup diagnostic incomplete; inspect sealed evidence if available.'
            exit 1
          fi
      - name: Retain sealed setup evidence
        if: always() && steps.setup.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcc-setup-diagnostic-sealed
          path: ${{ runner.temp }}/sliccy-tcc-setup-evidence.age
          if-no-files-found: error
          retention-days: 3

  diagnostic:
    if: false
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolated diagnostic
        id: diagnostic
        shell: bash
        env:
          SLICCY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          umask 077
          if python3 -B script/runner-proof/sealed_runner.py > "$RUNNER_TEMP/sliccy-screen-bootstrap.log" 2>&1; then
            echo 'Capture diagnostic finished; inspect sealed evidence.'
          else
            echo 'Capture diagnostic incomplete; inspect sealed evidence if available.'
            exit 1
          fi
      - name: Retain sealed evidence
        if: always() && steps.diagnostic.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screen-diagnostic-sealed
          path: ${{ runner.temp }}/sliccy-screen-evidence.age
          if-no-files-found: error
          retention-days: 3

  universal:
    if: false
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Universal identity diagnostic
        id: universal
        shell: bash
        env:
          SLICCY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
          SLICC_NO_TELEMETRY: '1'
          SLICC_NO_UPDATE_CHECK: '1'
        run: |
          set +x
          umask 077
          if python3 script/runner-proof/sealed_universal.py > "$RUNNER_TEMP/sliccy-universal-bootstrap.log" 2>&1; then
            echo 'Universal diagnostic finished; inspect sealed evidence.'
          else
            echo 'Universal diagnostic incomplete; inspect sealed evidence if available.'
            exit 1
          fi
      - name: Retain sealed universal evidence
        if: always() && steps.universal.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: universal-diagnostic-sealed
          path: ${{ runner.temp }}/sliccy-universal-evidence.age
          if-no-files-found: error
          retention-days: 3

  hosted-pid:
    if: false
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Hosted PID diagnostic
        id: pid
        shell: bash
        env:
          SLICCY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
          SLICC_NO_TELEMETRY: '1'
          SLICC_NO_UPDATE_CHECK: '1'
        run: |
          set +x
          umask 077
          if python3 script/runner-proof/sealed_hosted_pid.py > "$RUNNER_TEMP/sliccy-hosted-pid-bootstrap.log" 2>&1; then
            echo 'Hosted PID diagnostic finished; inspect sealed evidence.'
          else
            echo 'Hosted PID diagnostic incomplete; inspect sealed evidence if available.'
            exit 1
          fi
      - name: Retain sealed PID evidence
        if: always() && steps.pid.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-pid-diagnostic-sealed
          path: ${{ runner.temp }}/sliccy-hosted-pid-evidence.age
          if-no-files-found: error
          retention-days: 3
