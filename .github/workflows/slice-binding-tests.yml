name: Slice binding synthetic tests

on:
  push:
    branches: [proof/slice-binding-tests-v1]

permissions:
  contents: read

jobs:
  synthetic-slice-tests:
    if: github.repository == 'ai-ecoverse/sliccy-app' && github.event_name == 'push' && github.ref == 'refs/heads/proof/slice-binding-tests-v1'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Synthetic policy and runtime fault overlays
        run: python3 -B Tests/PrerequisiteProbe/hosted_slice_overlays.py
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slice-binding-test-results
          path: slice-test-results/
          if-no-files-found: error
          retention-days: 14
