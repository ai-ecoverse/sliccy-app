name: Capture slice synthetic integration tests

on:
  push:
    branches: [proof/capture-slice-v1]

permissions:
  contents: read

jobs:
  synthetic-slice-integration:
    if: github.repository == 'ai-ecoverse/sliccy-app' && github.event_name == 'push' && github.ref == 'refs/heads/proof/capture-slice-v1'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed hosted placement and source
        run: |
          python3 -B - <<'PY'
          import os,subprocess
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.environ['RUNNER_OS']=='macOS' and os.environ['RUNNER_ARCH']=='ARM64'
          assert subprocess.check_output(['/usr/bin/git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          PY
      - name: Pure source regressions
        run: |
          python3 -B -m unittest discover -s Tests/RunnerBSD -p test_source.py -v
          python3 -B -m unittest discover -s Tests/UniversalManifest -p test_surface_pin.py -v
          python3 -B -m unittest discover -s Tests/RunnerSlice -p 'test_*.py' -v
          python3 -B Tests/RunnerSlice/volume.py > receipt-volume.json
      - name: Actual C fabricated boundary and faults
        run: python3 -B Tests/RunnerBSD/hosted.py
      - name: Actual Swift synthetic boundaries and faults
        run: python3 -B Tests/RunnerSlice/hosted.py
      - name: Retain synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capture-slice-integration-results
          path: |
            slice-results/
            bsd-results/
            receipt-volume.json
          if-no-files-found: error
          retention-days: 14
